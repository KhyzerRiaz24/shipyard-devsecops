# Jenkins' configured SonarQube server supplies authentication via withSonarQubeEnv.
# Source comments explain flow; tests are analysed separately from application sources.
sonar.projectKey=shipyard
sonar.projectName=Shipyard
sonar.sources=apps/api/src,apps/web/src
sonar.tests=apps/api/test,tests/browser
sonar.exclusions=**/*.test.jsx,**/test-setup.js
sonar.sourceEncoding=UTF-8

# Coverage is generated by both workspace test commands before analysis.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info
